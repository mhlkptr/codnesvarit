<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Čo dnes variť? – Varecha.sk</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
      background: #faf7f2;
      color: #222;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #e5dfd5;
      margin-bottom: 18px;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 14px;
      gap: 6px;
    }
    select, input, button {
      padding: 8px 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #c84b28;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #a93b1d;
    }
    .status {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e5dfd5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5dfd5;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }
    .card h3 {
      margin: 0;
      font-size: 16px;
    }
    .meta {
      font-size: 13px;
      color: #555;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .secondary-btn {
      background: #444;
      color: #fff;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    .detail-box {
      grid-column: 1 / -1;
      margin: 8px 0;
      background: #fff;
      border: 1px solid #e5dfd5;
      border-radius: 10px;
      padding: 18px;
      display: none;
    }
    #customSubcategory {
      display: none;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Čo dnes variť?</h1>

  <div class="filters">
    <label>
      Kategória
      <select id="category">
        <option value="all">Všetky</option>
        <option value="meat">Mäso</option>
        <option value="pasta">Cestoviny</option>
        <option value="meatless">Bezmäsité</option>
        <option value="veggies">Zelenina</option>
        <option value="sweet">Sladké</option>
      </select>
    </label>

    <label>
      Podkategória / surovina
      <select id="subcategorySelect"></select>
      <input id="customSubcategory" type="text" placeholder="Zadajte vlastnú surovinu" />
    </label>

    <label>
      Náročnosť
      <select id="difficulty">
        <option value="all">Všetky</option>
        <option value="quick">Rýchle</option>
        <option value="classic">Klasické</option>
        <option value="weekend">Víkendové</option>
      </select>
    </label>

    <label>
      Počet ľudí
      <input id="people" type="number" min="1" max="20" value="2" />
    </label>

    <label>
      Počet dní
      <input id="days" type="number" min="1" max="7" value="1" />
    </label>

    <label>
      &nbsp;
      <button id="searchBtn" type="button">Načítať recepty</button>
    </label>
  </div>

  <div id="status" class="status">Pripravené. Kliknite na „Načítať recepty“.</div>
  <div id="results" class="grid"></div>

  <div id="detailBox" class="detail-box">
    <h2 id="detailTitle"></h2>
    <div id="detailContent"></div>
  </div>

  <script>
    const BACKEND_URL = window.location.origin.startsWith("http")
      ? window.location.origin
      : "http://localhost:8000";

    const SUBCATEGORIES_BY_CATEGORY = {
      all: [
        { value: "kuracie", label: "Kuracie mäso" },
        { value: "cestoviny", label: "Cestoviny" },
        { value: "zemiaky", label: "Zemiaky" },
        { value: "ryza", label: "Ryža" },
        { value: "syr", label: "Syr" }
      ],
      meat: [
        { value: "kuracie", label: "Kuracie mäso" },
        { value: "bravcove", label: "Bravčové mäso" },
        { value: "hovadzie", label: "Hovädzie mäso" },
        { value: "morcacie", label: "Morčacie mäso" },
        { value: "ryba", label: "Ryby" }
      ],
      pasta: [
        { value: "spagety", label: "Špagety" },
        { value: "penne", label: "Penne" },
        { value: "gnocchi", label: "Gnocchi" },
        { value: "lasagne", label: "Lasagne" },
        { value: "rezance", label: "Rezance" }
      ],
      meatless: [
        { value: "syr", label: "Syr" },
        { value: "sosovica", label: "Šošovica" },
        { value: "fazula", label: "Fazuľa" },
        { value: "huby", label: "Huby" },
        { value: "vajcia", label: "Vajcia" }
      ],
      veggies: [
        { value: "zemiaky", label: "Zemiaky" },
        { value: "cuketa", label: "Cuketa" },
        { value: "brokolica", label: "Brokolica" },
        { value: "tekvica", label: "Tekvica" },
        { value: "kapusta", label: "Kapusta" }
      ],
      sweet: [
        { value: "palacinky", label: "Palacinky" },
        { value: "kysnute cesto", label: "Kysnuté cesto" },
        { value: "kolace", label: "Koláče" }
      ]
    };

    const categoryEl = document.getElementById("category");
    const subcategorySelectEl = document.getElementById("subcategorySelect");
    const customSubcategoryEl = document.getElementById("customSubcategory");
    const difficultyEl = document.getElementById("difficulty");
    const peopleEl = document.getElementById("people");
    const daysEl = document.getElementById("days");
    const searchBtnEl = document.getElementById("searchBtn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const detailBoxEl = document.getElementById("detailBox");
    const detailTitleEl = document.getElementById("detailTitle");
    const detailContentEl = document.getElementById("detailContent");

    function populateSubcategories() {
      const cat = categoryEl.value;
      const items = SUBCATEGORIES_BY_CATEGORY[cat] || SUBCATEGORIES_BY_CATEGORY.all;
      subcategorySelectEl.innerHTML = "";

      const allOpt = document.createElement("option");
      allOpt.value = "all";
      allOpt.textContent = "Všetky v kategórii";
      subcategorySelectEl.appendChild(allOpt);

      for (const item of items) {
        const opt = document.createElement("option");
        opt.value = item.value;
        opt.textContent = item.label;
        subcategorySelectEl.appendChild(opt);
      }

      const customOpt = document.createElement("option");
      customOpt.value = "custom";
      customOpt.textContent = "Vlastná surovina...";
      subcategorySelectEl.appendChild(customOpt);

      toggleCustomSubcategory();
    }

    function toggleCustomSubcategory() {
      const isCustom = subcategorySelectEl.value === "custom";
      customSubcategoryEl.style.display = isCustom ? "block" : "none";
    }

    function getSelectedSubcategory() {
      if (subcategorySelectEl.value === "custom") {
        return customSubcategoryEl.value.trim() || "all";
      }
      return subcategorySelectEl.value;
    }

    function hideDetailBox() {
      detailBoxEl.style.display = "none";
      document.body.appendChild(detailBoxEl);
    }

    async function loadRecipeDetail(recipe, cardEl) {
      if (detailBoxEl.style.display === "block" && detailBoxEl.dataset.activeUrl === recipe.url) {
        hideDetailBox();
        return;
      }

      cardEl.insertAdjacentElement("afterend", detailBoxEl);
      detailBoxEl.dataset.activeUrl = recipe.url;
      detailBoxEl.style.display = "block";
      detailTitleEl.textContent = recipe.title;
      detailContentEl.textContent = "Načítavam detail receptu...";

      try {
        const res = await fetch(`${BACKEND_URL}/api/recipe-detail?url=${encodeURIComponent(recipe.url)}`);
        const data = await res.json();

        if (!res.ok || !data.ok) {
          detailContentEl.textContent = data.detail || data.error || "Detail sa nepodarilo načítať.";
          return;
        }

        const ingList = (data.ingredients || []).map((i) => `<li>${i}</li>`).join("");
        const stepList = (data.steps || []).map((s) => `<li>${s}</li>`).join("");

        detailContentEl.innerHTML = `
          ${ingList ? `<h3>Suroviny</h3><ul>${ingList}</ul>` : "<p>Suroviny sa nenašli.</p>"}
          ${stepList ? `<h3>Postup</h3><ol>${stepList}</ol>` : "<p>Postup sa nenašiel.</p>"}
          <p><a class="secondary-btn" href="${recipe.url}" target="_blank" rel="noopener noreferrer">Otvoriť na Varecha.sk</a></p>
        `;
      } catch (err) {
        detailContentEl.textContent = `Chyba pri načítaní detailu: ${err.message}`;
      }
    }

    function renderRecipes(recipes) {
      hideDetailBox();
      resultsEl.innerHTML = "";

      if (!recipes.length) {
        resultsEl.innerHTML = "<p>Nenašli sa žiadne recepty.</p>";
        return;
      }

      for (const recipe of recipes) {
        const card = document.createElement("article");
        card.className = "card";

        const timeText = recipe.prep_minutes ? `${recipe.prep_minutes} min` : "čas neuvedený";
        const imgHtml = recipe.image ? `<img src="${recipe.image}" alt="${recipe.title}" />` : "";

        card.innerHTML = `
          <div>
            ${imgHtml}
            <h3>${recipe.title}</h3>
            <div class="meta">${recipe.difficulty} • ${timeText}</div>
            ${recipe.snippet ? `<p>${recipe.snippet}</p>` : ""}
          </div>
          <div class="actions">
            <button type="button" class="detail-btn">Detail receptu</button>
            <a class="secondary-btn" href="${recipe.url}" target="_blank" rel="noopener noreferrer">Varecha.sk</a>
          </div>
        `;

        card.querySelector(".detail-btn").addEventListener("click", () => {
          loadRecipeDetail(recipe, card);
        });

        resultsEl.appendChild(card);
      }
    }

    async function searchRecipes() {
      const params = new URLSearchParams({
        category: categoryEl.value,
        subcategory: getSelectedSubcategory(),
        difficulty: difficultyEl.value,
        people: peopleEl.value || "2",
        days: daysEl.value || "1"
      });

      statusEl.textContent = "Vyhľadávam recepty...";

      try {
        const res = await fetch(`${BACKEND_URL}/api/recipes?${params.toString()}`);
        const data = await res.json();

        if (!res.ok || !data.ok) {
          statusEl.textContent = data.error || data.detail || "Chyba pri vyhľadávaní.";
          renderRecipes([]);
          return;
        }

        statusEl.textContent = `Nájdených receptov: ${data.count} (spolu porcií: ${data.total_portions}, dopyt: ${data.query})`;
        renderRecipes(data.recipes || []);
      } catch (err) {
        statusEl.textContent = `Chyba komunikácie so serverom: ${err.message}`;
      }
    }

    categoryEl.addEventListener("change", populateSubcategories);
    subcategorySelectEl.addEventListener("change", toggleCustomSubcategory);
    searchBtnEl.addEventListener("click", searchRecipes);

    populateSubcategories();
  </script>
</body>
</html>
